<div class="interior" [class.is-open]="playerOpen()">
  <main class="page">
    <div class="theme" role="radiogroup" aria-labelledby="themeLabel">
      <span class="theme__label" id="themeLabel">
        <svg viewBox="0 0 24 24" class="i-fill" aria-hidden="true"><path d="M12 3a9 9 0 000 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.8-1.7H16a5 5 0 005-5C21 6.4 17 3 12 3zm-5.5 9a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3-4a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm5 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3 4a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/></svg>
        Color
      </span>
      @for (t of themes; track t.name; let i = $index) {
        <button #themeOpt type="button" class="theme__opt" role="radio"
                [attr.aria-checked]="theme() === t.name" [tabIndex]="theme() === t.name ? 0 : -1"
                (click)="theme.set(t.name)" (keydown)="onThemeKeydown(i, $event)">
          <span class="theme__dot" [style.--c]="t.color"></span>{{ t.label }}
        </button>
      }
    </div>
    <h1 class="page__title">Cartas para mi chiquita ♥️💞</h1>

    <div class="sheet-wrap">
      <svg class="spark spark--1" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z"/></svg>
      <svg class="spark spark--2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z"/></svg>
      <svg class="spark spark--3" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z"/></svg>
      <svg class="spark spark--4" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z"/></svg>

      <article class="paper" aria-live="polite" [attr.aria-label]="'Carta 1 de ' + letters.length">
        <svg class="paper__heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.2-4.4-9.2-8.8C1.4 8 3.3 4.5 6.8 4.5c2 0 3.4 1.1 5.2 3 1.8-1.9 3.2-3 5.2-3 3.5 0 5.4 3.5 4 6.7C19.2 15.6 12 20 12 20z"/></svg>
        <p class="paper__date">{{ letter.date }}</p>
        <h2 class="paper__greeting">{{ letter.greeting }}</h2>
        <div class="paper__body">
          @for (p of letter.body; track $index) {
            <p>{{ p }}</p>
          }
        </div>
        <p class="paper__sign">{{ letter.signature }}</p>
      </article>
    </div>

    <p class="coming-soon">
      <svg viewBox="0 0 24 24" class="i-fill" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z"/></svg>
      <span>Mi amor, iré mejorando de a poco la app<br>y también voy a colocar más cartas... 🎉💞♥️</span>
    </p>
  </main>

  <app-player [(open)]="playerOpen" />
</div>
